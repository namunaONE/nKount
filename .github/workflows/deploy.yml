name: Deploy to GitHub Pages

# Deploy nKount to GitHub Pages on push to main branch
on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'build.yaml'
  workflow_dispatch:

# Cancel previous runs if new commit is pushed
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-3.19.5'
      
      # Install dependencies
      - name: Install dependencies
        run: flutter pub get
      
      # Generate code (Freezed, JSON serializable, Riverpod)
      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs
      
      # Build web app
      - name: Build web
        run: flutter build web --release --web-renderer canvaskit
        env:
          FLUTTER_WEB_CANVASKIT_URL: 'https://unpkg.com/canvaskit-wasm@0.39.0/bin/'
      
      # Configure GitHub Pages
      - name: Configure GitHub Pages
        run: |
          cd build/web
          # Create .nojekyll to prevent GitHub from ignoring files
          touch .nojekyll
          
          # Create CNAME file if custom domain is used
          # echo 'nkount.namunaone.com.np' > CNAME
      
      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          keep_files: false
          force_orphan: true
          enable_jekyll: false
          exclude_assets: '.git,*.sh,*.yml,*.yaml,*.json,*.md,*.txt,CNAME'
      
      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nkount-web-build
          path: build/web
          retention-days: 7
      
      # Notify on success
      - name: Notify deployment success
        if: success()
        run: echo "✅ Successfully deployed to GitHub Pages"
      
      # Notify on failure
      - name: Notify deployment failure
        if: failure()
        run: echo "❌ Deployment failed. Check logs for details"
