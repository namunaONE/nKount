name: Deploy to GitHub Pages

# Deploy nKount to GitHub Pages on push to main branch
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel previous runs if new commit is pushed
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-3.19.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Freezed, JSON serializable, Riverpod)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build web app
        run: flutter build web --release --base-href /nKount/ --web-renderer canvaskit

      - name: Configure GitHub Pages
        run: |
          cd build/web
          # Prevent Jekyll processing
          touch .nojekyll
          # SPA fallback: unknown routes load the app instead of 404
          cp index.html 404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nkount-web-build
          path: build/web
          retention-days: 7

      - name: Deployment status
        run: echo "${{ job.status == 'success' && 'Deployed to GitHub Pages' || 'Deployment failed' }}"
