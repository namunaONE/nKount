name: Deploy to GitHub Pages

# Branchless deployment: Pages serves the build artifact directly.
# No gh-pages branch is created. Requires Pages source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.5'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-3.19.5'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Freezed, JSON serializable, Riverpod)
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build web app
        run: flutter build web --release --base-href /nKount/

      - name: Configure Pages artifact
        run: |
          cd build/web
          touch .nojekyll
          cp index.html 404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
