targets:
  $default:
    builders:
      # Generate freezed models (default .freezed.dart output)
      freezed:
        generate_for:
          include:
            - lib/core/models/*.dart

      # Generate JSON serializable (default .g.dart output)
      json_serializable:
        generate_for:
          include:
            - lib/core/models/*.dart

      # Generate Riverpod (default .g.dart output)
      riverpod_generator:
        generate_for:
          include:
            - lib/core/providers/*.dart

      # Scope hive_generator to models only (default runs on all files)
      hive_generator:
        generate_for:
          include:
            - lib/core/models/*.dart
