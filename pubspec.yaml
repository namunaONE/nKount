name: nkount
description: Nepali Accounting Software - Simple, IRD Compliant, Production Ready
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^18.0.2

  # Persistence - Drift (SQLite) for double-entry accounting
  drift: ^2.18.0
  drift_flutter: ^0.2.2
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24

  # Persistence - Hive CE (for migration & backup)
  hive_ce: ^2.6.0
  hive_ce_flutter: ^2.3.0
  hive_ce_generator: ^1.4.0
  path_provider: ^2.1.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Date & Time (Bikram Sambat)
  nepali_date_picker: ^8.0.0
  nepali_utils: ^3.0.8

  # PDF & Printing
  printing: ^5.11.1
  pdf: ^3.10.7

  # UUID for unique IDs
  uuid: ^4.2.1

  # Freezed for immutable models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Logging
  logger: ^2.0.2+1

  path: ^1.9.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.4.6
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  analyzer: ^6.4.1

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
