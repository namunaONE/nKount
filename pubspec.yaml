name: nkount
description: Nepali Accounting Software - Simple, IRD Compliant, Production Ready
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^18.0.2

  # Persistence - Hive CE (offline-first IndexedDB storage)
  hive_ce: ^2.6.0
  hive_ce_flutter: ^2.3.0
  hive_ce_generator: ^1.4.0
  path_provider: ^2.1.1

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Date & Time (Bikram Sambat)
  nepali_utils: ^3.0.8

  # Nepal administrative divisions (offline: 7 provinces, 77 districts,
  # 753 palikas) for the location picker
  nepal_admin_api: ^2.7.3

  # PDF & Printing
  printing: ^5.11.1
  pdf: ^3.10.7

  # UUID for unique IDs
  uuid: ^4.2.1

  # Web file download/upload (backup & restore on web)
  web: ^1.1.1

  # Freezed for immutable models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Logging
  logger: ^2.0.2+1

  path: ^1.9.0
  fl_chart: ^1.2.0
  # Pinned to v6: v9+ migrates to package:material_ui and breaks
  # Flutter Material TextTheme compatibility.
  google_fonts: ^6.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.13
  freezed: ^2.4.6
  json_serializable: ^6.8.0
  analyzer: ^6.4.1

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # NOTE: do NOT list assets/fonts/ here. Font files declared below in
    # `fonts:` are bundled automatically; listing the directory under
    # `assets:` too makes the web FontManifest resolve them as
    # `assets/assets/fonts/...` and fonts fail to load in release builds.
    # Hind is PDF-only (loaded via rootBundle), so it needs explicit
    # asset entries (it must NOT go in `fonts:`).
    - assets/fonts/Hind-Regular.ttf
    - assets/fonts/Hind-Bold.ttf

  # Bundled for offline-first (IndexedDB app must work without network)
  # and deterministic widget tests. google_fonts uses these instead of
  # runtime fetching (see GoogleFonts.config.allowRuntimeFetching=false
  # in tests). Filenames must match the google_fonts API prefixes
  # (<Family>-<Weight>.ttf). Each file is the variable font, so all
  # weights render from one source.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansDevanagari-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansDevanagari-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
