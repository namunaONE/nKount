name: nkount
description: Nepali Accounting Software - Simple, IRD Compliant, Production Ready
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  hive_generator: ^2.0.1
  
  # Local Storage for Web
  shared_preferences: ^2.2.2

  # Forms & Validation
  flutter_hooks: ^0.20.0
  formz: ^0.7.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.1

  # UI Components
  flutter_form_builder: ^7.7.0
  form_builder_validators: ^9.0.0
  data_table_2: ^2.5.10
  syncfusion_flutter_datagrid: ^23.1.40

  # Date & Time
  intl: ^0.18.1
  nepali_date_picker: ^1.0.0
  nepali_utils: ^1.0.0

  # Icons
  cupertino_icons: ^1.0.6
  flutter_iconpicker: ^3.0.0

  # PDF & Printing
  printing: ^5.11.1
  pdf: ^3.10.7

  # UUID for unique IDs
  uuid: ^4.2.1

  # Freezed for immutable models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # Network (for future API)
  dio: ^5.4.0

  # Error handling
  equatable: ^2.0.5

  # Logging
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code generation
  build_runner: ^2.4.8
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9
  
  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Nepali
      fonts:
        - asset: assets/fonts/Preeti.ttf

  module:
    androidPackage: np.com.namunaone.nkount
    iosBundleIdentifier: np.com.namunaone.nkount

# Flutter Web Configuration
flutter_web:
  canvas-kit: auto
